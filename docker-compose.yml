version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mishkat_db
    environment:
      POSTGRES_DB:       mishkat_db
      POSTGRES_USER:     mishkat_user
      POSTGRES_PASSWORD: mishkat_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mishkat_user -d mishkat_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mishkat_api
    env_file: ./backend/.env
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     mishkat_db
      DB_USER:     mishkat_user
      DB_PASSWORD: mishkat_pass
      NODE_ENV:    production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mishkat_web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
